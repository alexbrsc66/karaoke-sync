<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Karaoke Sync</title>
<style>
  :root { --bg:#14161a; --panel:#1d2026; --line:#2b3038; --txt:#e8eaed; --dim:#8b93a0; --acc:#ffb020; --ok:#3ecf8e; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--txt); font:15px system-ui,Segoe UI,sans-serif; height:100vh; display:flex; flex-direction:column; }
  header { display:flex; gap:8px; align-items:center; padding:8px 12px; background:var(--panel); border-bottom:1px solid var(--line); flex-wrap:wrap; }
  button, .btn { background:#2a2f38; color:var(--txt); border:1px solid var(--line); border-radius:6px; padding:6px 12px; cursor:pointer; font:inherit; }
  button:hover, .btn:hover { background:#353b46; }
  button.primary { background:var(--acc); color:#000; border-color:var(--acc); font-weight:700; }
  input[type=number] { width:70px; background:#101216; color:var(--txt); border:1px solid var(--line); border-radius:6px; padding:5px; }
  label.opt { color:var(--dim); font-size:13px; display:flex; gap:5px; align-items:center; }
  main { flex:1; display:grid; grid-template-columns: minmax(0,1.3fr) minmax(460px,1fr); min-height:0; }
  #left { display:flex; flex-direction:column; padding:10px; gap:8px; min-height:0; }
  #stage { position:relative; background:#000; border-radius:8px; overflow:hidden; flex:1; min-height:200px; }
  video { width:100%; height:100%; object-fit:contain; display:block; }
  #overlay { position:absolute; left:0; right:0; bottom:8%; text-align:center; padding:0 5%; pointer-events:none; text-shadow:0 2px 6px #000, 0 0 3px #000; }
  #cur { font-size:clamp(22px,4.2vw,64px); font-weight:800; min-height:1.2em; }
  #cur .w { position:relative; display:inline-block; white-space:nowrap; }
  #cur .h { position:absolute; left:0; top:0; overflow:hidden; white-space:nowrap; width:0; }
  input[type=color] { width:30px; height:26px; padding:0; border:1px solid var(--line); border-radius:4px; background:none; cursor:pointer; }
  #nxt { font-size:clamp(14px,2.2vw,32px); margin-top:.2em; min-height:1.2em; }
  #wave { width:100%; height:100px; flex:none; background:#101216; border-radius:6px; cursor:crosshair; display:block; }
  #bar { display:flex; gap:8px; align-items:center; }
  #seek { flex:1; }
  #time { font-variant-numeric:tabular-nums; color:var(--dim); min-width:110px; text-align:right; }
  #tap { font-size:22px; font-weight:800; padding:14px; width:100%; background:var(--ok); color:#000; border:0; border-radius:8px; user-select:none; }
  #tap:active { filter:brightness(1.2); transform:scale(.99); }
  #right { display:flex; flex-direction:column; min-height:0; border-left:1px solid var(--line); }
  #lyricsEdit { display:none; flex:1; margin:10px; background:#101216; color:var(--txt); border:1px solid var(--line); border-radius:6px; padding:8px; font:inherit; resize:none; }
  #rhead { padding:8px 10px; color:var(--dim); font-size:13px; display:flex; justify-content:space-between; align-items:center; }
  #list { flex:1; overflow:auto; padding:0 6px 10px; }
  .row { display:grid; grid-template-columns: 26px 78px 1fr auto; gap:6px; align-items:center; padding:3px 6px; border-radius:6px; border:1px solid transparent; }
  .row:hover { background:#20242b; }
  .row.cursor { border-color:var(--acc); background:#2a2515; }
  .row.live .txt { color:var(--acc); font-weight:700; }
  .row .n { color:var(--dim); font-size:12px; text-align:right; }
  .row .t { font-variant-numeric:tabular-nums; background:#101216; border:1px solid var(--line); color:var(--txt); border-radius:4px; padding:3px 4px; width:78px; font-size:13px; }
  .row .t.empty { color:var(--dim); }
  .row .txt { cursor:pointer; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .row .acts { display:flex; gap:2px; }
  .row .acts button { padding:2px 6px; font-size:12px; }
  .row .acts button.sep { margin-left:6px; }
  .row .txt .sub { display:block; font-size:11px; color:var(--dim); font-weight:400; overflow:hidden; text-overflow:ellipsis; }
  .row .txt.blank { color:var(--dim); font-style:italic; }
  .row .edit { width:100%; background:#101216; color:var(--txt); border:1px solid var(--acc); border-radius:4px; padding:3px 6px; font:inherit; }
  kbd { background:#2a2f38; border:1px solid var(--line); border-radius:4px; padding:0 5px; font-size:12px; }
  #help { color:var(--dim); font-size:12px; line-height:1.7; }
  @media (max-width:800px){ main{grid-template-columns:1fr; grid-template-rows:auto 1fr;} }
</style>
</head>
<body>
<header>
  <button id="bV">🎬 Video</button><input id="fVideo" type="file" accept="video/*,audio/*,.mkv,.mp4,.webm,.mov,.mp3,.wav" hidden>
  <button id="bT">📄 Lyrics / LRC</button><input id="fText" type="file" hidden>
  <button id="bMode" title="Switch the text shown and edited: original lyrics or your cover">🔤 Showing: Cover</button>
  <button id="bPaste">✏️ Edit text</button>
  <span id="status" style="flex:1;color:#ffb020;font-size:13px"></span>
  <label class="opt">Speed
    <select id="rate"><option>0.5</option><option>0.75</option><option selected>1</option></select>
  </label>
  <label class="opt">Tap lead (s) <input id="lead" type="number" step="0.05" value="0.15"></label>
  <label class="opt">Text <input id="cText" type="color" value="#ffffff"></label>
  <label class="opt">Highlight <input id="cHi" type="color" value="#ffb020"></label>
  <label class="opt">Outline <input id="cOut" type="color" value="#000000"></label>
  <label class="opt">Next line <input id="cNext" type="color" value="#ffd27a"></label>
  <button id="bProjSave">💾 Save project</button><button id="bProjLoad">📂 Load project</button>
  <button id="bSave" class="primary">💾 Export .lrc</button>
  <button id="bFull">⛶ Fullscreen</button>
</header>
<main>
  <section id="left">
    <div id="stage">
      <video id="v"></video>
      <div id="overlay"><div id="cur"></div><div id="nxt"></div></div>
    </div>
    <canvas id="wave" title="Wheel: zoom · drag: pan · click: seek · drag an orange marker: move that line · double-click: show all"></canvas>
    <div id="bar">
      <button id="bPlay">▶</button>
      <input id="seek" type="range" min="0" max="1000" value="0">
      <span id="time">0:00.0</span>
      <input id="vol" type="range" min="0" max="1" step="0.05" value="1" title="Volume" style="width:80px">
    </div>
    <button id="tap">TAP — mark the line (Space)</button>
    <div id="help">
      <kbd>Space</kbd> mark the current line and move on · <kbd>Enter</kbd> play/pause ·
      <kbd>⌫</kbd> undo last tap · <kbd>←</kbd><kbd>→</kbd> ±3s · <kbd>↑</kbd><kbd>↓</kbd> previous/next line ·
      <kbd>[</kbd><kbd>]</kbd> move current line ∓0.1s ·
      double-click a line = edit text (<kbd>Enter</kbd> confirms, <kbd>Ctrl+Enter</kbd> confirms and adds a line below) · <kbd>Ctrl+Z</kbd> undo
    </div>
  </section>
  <section id="right">
    <textarea id="lyricsEdit" placeholder="Paste the lyrics here, one line per verse. Then press 'Apply text'."></textarea>
    <div id="rhead"><span id="count"></span><button id="bApply" style="display:none" class="primary">Apply text</button><span><button id="bEnds" title="Find where the singing of each line ends, from the waveform. Fills the missing ones; Shift+click recalculates all.">⇥ Auto ends</button> <button id="bAddEnd">＋ Line</button> <button id="bClear">Clear times</button> <button id="bClearAll">Clear all</button></span></div>
    <div id="list"></div>
  </section>
</main>

<script>
const $ = id => document.getElementById(id);
const v = $('v');
let lines = [];        // {text, t}  t = seconds or null
let cursor = 0;        // line that the next tap will mark
let key = 'karaoke:default';

// ---------- utilities ----------
const fmt = t => { if (t==null) return ''; const m=Math.floor(t/60), s=t-m*60; return m+':'+s.toFixed(2).padStart(5,'0'); };
const parse = s => { s=s.trim(); if(!s) return null; const m=s.match(/^(\d+):(\d+(?:\.\d+)?)$/); return m? (+m[1])*60+ +m[2] : (isNaN(+s)?null:+s); };
const sty = { text:'#ffffff', hi:'#ffb020', outline:'#000000', next:'#ffd27a' };
try { Object.assign(sty, JSON.parse(localStorage.getItem('karaoke:style')||'{}')); } catch(e){}
const pickers = { text:'cText', hi:'cHi', outline:'cOut', next:'cNext' };
function applyStyle() {
  for (const k in pickers) $(pickers[k]).value = sty[k];
  const o = sty.outline, sh = [[-2,-2],[2,-2],[-2,2],[2,2],[0,-2],[0,2],[-2,0],[2,0]].map(([x,y])=>`${x}px ${y}px 0 ${o}`).join(',');
  $('overlay').style.textShadow = sh + ', 0 3px 8px #000';
  $('cur').style.color = sty.text; $('cur').style.setProperty('--hi', sty.hi);
  $('nxt').style.color = sty.next;
  document.querySelectorAll('#cur .h').forEach(e=>e.style.color = sty.hi);
}
for (const k in pickers) $(pickers[k]).oninput = e => { sty[k] = e.target.value; try { localStorage.setItem('karaoke:style', JSON.stringify(sty)); } catch(_){} applyStyle(); };
// every line has two texts: text = your cover, orig = the original lyrics
let mode = 'cover';
try { mode = localStorage.getItem('karaoke:mode') || 'cover'; } catch(e){}
const FIELD = () => mode==='orig' ? 'orig' : 'text';
const OTHER = () => mode==='orig' ? 'text' : 'orig';
const shown = l => l[FIELD()] || '';                                   // what the list shows and edits
const disp  = l => (mode==='orig' ? (l.orig || l.text) : l.text) || ''; // what preview, .lrc and render use
function setMode(m) { mode = m; try { localStorage.setItem('karaoke:mode', m); } catch(e){} editing = null; render(); }
const save = () => { try { localStorage.setItem(key, JSON.stringify(lines)); localStorage.setItem('karaoke:last', JSON.stringify({key, lines})); } catch(e){} };

// ---------- loading ----------
const status = m => $('status').textContent = m;
$('bV').onclick = () => $('fVideo').click();
$('bT').onclick = () => $('fText').click();
$('bProjLoad').onclick = () => $('fText').click();
// ask where to save (Chrome/Edge); otherwise a normal download
async function saveAs(fname, content, mime, ext, desc) {
  if (window.showSaveFilePicker) {
    try {
      const h = await showSaveFilePicker({ suggestedName:fname, id:'karaoke', types:[{description:desc, accept:{[mime]:[ext]}}] });
      const w = await h.createWritable(); await w.write(content); await w.close();
      return status('Saved: ' + h.name);
    } catch(e) { if (e.name==='AbortError') return status('Save cancelled'); }
  }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([content], {type:mime})); a.download = fname; a.click();
  status('Downloaded: ' + fname);
}
$('bProjSave').onclick = () => {
  const name = key.split(':')[1] || 'karaoke';
  saveAs(name.replace(/\.[^.]+$/,'') + '.karaoke.json', JSON.stringify({version:3, video:name, mode, style:sty, lines}, null, 1), 'application/json', '.json', 'Karaoke project');
};
v.addEventListener('error', () => status('⚠ The browser cannot read this video (unsupported format/codec). Try H.264 mp4 or webm.'));
v.addEventListener('loadedmetadata', () => status('Video loaded: ' + fmt(v.duration)));
addEventListener('error', e => status('Error: ' + e.message));
$('fVideo').onchange = e => {
  const f = e.target.files[0]; if(!f) return;
  status('Loading ' + f.name + '...');
  loadWave(f);
  v.src = URL.createObjectURL(f);
  key = 'karaoke:' + f.name + ':' + f.size;
  try { const s = localStorage.getItem(key); if (s && lines.length===0) { lines = JSON.parse(s); cursor = nextEmpty(); render(); } else if (s) { lines = JSON.parse(s); cursor = nextEmpty(); render(); } } catch(e){}
};
$('fText').onchange = async e => {
  const f = e.target.files[0]; if(!f) return;
  setFromText(await f.text()); status('Lyrics loaded: ' + lines.length + ' lines');
};
function setFromText(txt) {
  if (/^\s*[\[{]/.test(txt)) { try {
    const j = JSON.parse(txt), arr = Array.isArray(j) ? j : j.lines;
    if (j.style) { Object.assign(sty, j.style); applyStyle(); }
    if (Array.isArray(arr)) { if (j.mode==='orig' || j.mode==='cover') mode = j.mode;
      lines = arr.map(l=>({text:String(l.text), orig:String(l.orig||''), t:l.t==null?null:+l.t, e:l.e==null?null:+l.e})); cursor = nextEmpty(); save(); render();
      status('Project loaded: ' + lines.length + ' lines' + (j.video ? ' — original video: ' + j.video : '')); return; }
  } catch(e){} }
  const out = [];
  for (const raw of txt.split(/\r?\n/)) {
    const m = raw.match(/^\s*\[(\d+):(\d+(?:\.\d+)?)\]\s*(.*)$/);
    if (m) out.push({ text:m[3], orig:'', t:(+m[1])*60+ +m[2] });
    else if (raw.trim()) out.push({ text:raw.trim(), orig:'', t:null });
  }
  lines = out; cursor = nextEmpty(); save(); render();
}
const nextEmpty = () => { const i = lines.findIndex(l=>l.t==null); return i<0 ? lines.length : i; };

// drag & drop
addEventListener('dragover', e=>e.preventDefault());
addEventListener('drop', async e => {
  e.preventDefault();
  for (const f of e.dataTransfer.files) {
    if (/^(video|audio)/.test(f.type)) { const dt=new DataTransfer(); dt.items.add(f); $('fVideo').files=dt.files; $('fVideo').onchange({target:$('fVideo')}); }
    else setFromText(await f.text());
  }
});

// pasted-text editor
$('bMode').onclick = () => setMode(mode==='orig' ? 'cover' : 'orig');
$('bPaste').onclick = () => {
  const open = $('lyricsEdit').style.display==='block';
  if (!open) $('lyricsEdit').value = lines.map(shown).join('\n');
  $('lyricsEdit').style.display = open ? 'none':'block';
  $('bApply').style.display = open ? 'none':'';
  $('list').style.display = open ? '':'none';
};
$('bApply').onclick = () => {
  snap();
  const F = FIELD(), O = OTHER(), old = lines;
  const texts = $('lyricsEdit').value.split(/\r?\n/).map(x=>x.trim());
  while (texts.length && !texts[texts.length-1]) texts.pop();           // only trailing blank lines are dropped
  const mk = (txt, src) => { const n = {text:'', orig:'', t: src ? src.t : null, e: src ? (src.e ?? null) : null}; n[F] = txt; n[O] = src ? (src[O]||'') : ''; return n; };
  if (texts.length === old.length) lines = texts.map((txt,i) => mk(txt, old[i]));   // same number of lines: times (and the other text) are kept
  else { let p = 0; lines = texts.map(txt => { let j=p; while (j<old.length && shown(old[j])!==txt) j++; if (j<old.length) { p=j+1; return mk(txt, old[j]); } return mk(txt, null); }); }
  cursor = nextEmpty(); save(); $('bPaste').onclick(); render();
};
// two-click confirmation (browser confirm() dialogs can be blocked)
function confirmButton(id, label, action) {
  const b = $(id); let timer = null;
  b.onclick = () => {
    if (!timer) { b.textContent = 'Sure? Click again'; b.style.background = '#a33'; timer = setTimeout(() => { timer = null; b.textContent = label; b.style.background = ''; }, 3000); return; }
    clearTimeout(timer); timer = null; b.textContent = label; b.style.background = '';
    snap(); action(); save(); render();
  };
}
confirmButton('bClear', 'Clear times', () => { lines.forEach(l => { l.t = null; l.e = null; }); cursor = 0; });
confirmButton('bClearAll', 'Clear all', () => {
  // start from scratch for a new song: lines, video/audio, waveform and the autosave of this song
  try { localStorage.removeItem(key); localStorage.removeItem('karaoke:last'); } catch(e){}
  lines = []; cursor = 0; editing = null; key = 'karaoke:default';
  v.pause(); v.removeAttribute('src'); v.load();
  peaks = null; wView = {t0:0, span:60};
  $('fVideo').value = ''; $('fText').value = '';
  status('Cleared — ready for a new song (Ctrl+Z restores the lines, not the video)');
});

// ---------- TAP ----------
function tap() {
  if (cursor >= lines.length) return;
  lines[cursor].t = Math.max(0, v.currentTime - (+$('lead').value||0));
  cursor++; save(); render();
}
function undo() {
  if (cursor <= 0) return;
  cursor--; const t = lines[cursor].t; lines[cursor].t = null;
  if (t!=null) v.currentTime = Math.max(0, t - 2);
  save(); render();
}
$('tap').addEventListener('mousedown', e => { e.preventDefault(); tap(); });
v.addEventListener('mousedown', e => { if (e.button===0) tap(); });   // click on the video = tap

// ---------- keyboard ----------
addEventListener('keydown', e => {
  if (/INPUT|TEXTAREA|SELECT/.test(e.target.tagName) && e.target.type!=='range') return;
  if ((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==='z') { e.preventDefault(); undoEdit(); return; }
  switch (e.key) {
    case ' ': e.preventDefault(); if(!e.repeat) tap(); break;
    case 'Enter': e.preventDefault(); v.paused ? v.play() : v.pause(); break;
    case 'Delete': { const i=Math.min(cursor,lines.length-1); if(lines[i]){ lines[i].t=null; lines[i].e=null; save(); render(); } break; }
    case 'Backspace': e.preventDefault(); undo(); break;
    case 'ArrowLeft': e.preventDefault(); v.currentTime -= 3; break;
    case 'ArrowRight': e.preventDefault(); v.currentTime += 3; break;
    case 'ArrowUp': e.preventDefault(); goto_(cursor-1); break;
    case 'ArrowDown': e.preventDefault(); goto_(cursor+1); break;
    case '[': nudge(Math.min(cursor,lines.length-1), -0.1); break;
    case ']': nudge(Math.min(cursor,lines.length-1), +0.1); break;
  }
});
function goto_(i) { cursor = Math.max(0, Math.min(lines.length, i)); render(); }
function nudge(i, d) { const l=lines[i]; if(!l||l.t==null) return; l.t=Math.max(0,l.t+d); save(); render(); }

// ---------- line editing ----------
let editing = null; const hist = [];
function snap() { hist.push(JSON.stringify(lines)); if (hist.length>100) hist.shift(); }
function undoEdit() { if (!hist.length) return status('Nothing to undo'); lines = JSON.parse(hist.pop()); editing=null; cursor=Math.min(cursor,lines.length); save(); render(); status('Undone (Ctrl+Z)'); }
function insertAfter(i) { snap(); lines.splice(i+1,0,{text:'',orig:'',t:null,e:null}); cursor=i+1; editing=i+1; save(); render(); }
function removeAt(i) { snap(); lines.splice(i,1); if (cursor>i) cursor--; cursor=Math.min(cursor,lines.length); editing=null; save(); render(); status('Line deleted — Ctrl+Z to undo'); }
$('bAddEnd').onclick = () => insertAfter(lines.length-1);

// ---------- list ----------
function render() {
  $('bMode').textContent = mode==='orig' ? '🔤 Showing: Original' : '🔤 Showing: Cover';
  $('count').textContent = `${lines.filter(l=>l.t!=null).length}/${lines.length} lines synced`;
  const L = $('list'); L.innerHTML = '';
  lines.forEach((l,i) => {
    const r = document.createElement('div'); r.className='row'; r.dataset.i=i;
    r.innerHTML = `<span class="n">${i+1}</span><input class="t ${l.t==null?'empty':''}" value="${fmt(l.t)}" placeholder="--:--.--"><span class="txt"></span>
      <span class="acts"><button title="Set the START of this line to the current time">⏱</button><button title="Set the END of the singing to the current time">⟧</button><button title="-0.1s">−</button><button title="+0.1s">+</button><button title="Clear this tap">✕</button><button class="sep" title="Edit the text (or double-click the line)">✎</button><button title="Insert a line below">＋</button><button title="Delete the line">🗑</button></span>`;
    const tx = r.querySelector('.txt');
    const main = shown(l); tx.textContent = main || (mode==='orig' ? '(no original text)' : '(empty line)'); if (!main) tx.classList.add('blank');
    const sec = l[OTHER()]; if (sec) { const sp = document.createElement('span'); sp.className = 'sub'; sp.textContent = (mode==='orig' ? 'cover: ' : 'original: ') + sec; tx.appendChild(sp); }
    tx.onclick = () => { cursor=i; if(l.t!=null) v.currentTime=Math.max(0,l.t-0.5); render(); };
    tx.ondblclick = () => { editing=i; render(); };
    if (editing === i) {
      const ed = document.createElement('input'); ed.className='edit'; ed.value = shown(l); ed.placeholder = mode==='orig' ? 'Original line text' : 'Cover line text';
      let done = false;
      const commit = (next) => { if (done) return; done = true; const val = ed.value.trim(); if (val !== shown(l)) { snap(); l[FIELD()] = val; } editing=null; save();
        if (next) insertAfter(i); else render(); };
      ed.onkeydown = e => { if (e.key==='Enter') { e.preventDefault(); commit(e.ctrlKey||e.shiftKey); } else if (e.key==='Escape') { done=true; editing=null; render(); } e.stopPropagation(); };
      ed.onblur = () => commit(false);
      tx.replaceWith(ed); setTimeout(()=>{ ed.focus(); ed.select(); },0);
    }
    const inp = r.querySelector('.t');
    inp.onchange = () => { l.t = parse(inp.value); save(); render(); };
    inp.onfocus = () => { cursor=i; };
    const [bNow,bEnd,bMinus,bPlus,bDel,bEdit,bIns,bRem] = r.querySelectorAll('button');
    bEdit.onclick = () => { editing=i; render(); };
    bIns.onclick = () => insertAfter(i);
    bRem.onclick = () => removeAt(i);
    bEnd.onclick = () => { if (l.t==null) return status('Set the start of this line first.'); snap(); l.e = Math.max(l.t+0.1, v.currentTime); save(); render(); };
    bNow.onclick = () => { l.t=v.currentTime; save(); render(); };
    bMinus.onclick = () => nudge(i,-0.1);
    bPlus.onclick = () => nudge(i,+0.1);
    bDel.onclick = () => { l.t=null; l.e=null; cursor=i; save(); render(); };
    L.appendChild(r);
  });
  mark(true);
}
let lastLive = -2;
function liveIndex(t) { let k=-1; for (let i=0;i<lines.length;i++) if (lines[i].t!=null && lines[i].t<=t) k = i; return k; }
// shrink the big line so it always fits inside the video area
function fitCur() {
  const cur = $('cur'), w = cur.querySelector('.w'); cur.style.fontSize = '';
  if (!w) return;
  const max = $('stage').clientWidth * 0.9;
  if (w.offsetWidth > max) cur.style.fontSize = (parseFloat(getComputedStyle(cur).fontSize) * max / w.offsetWidth) + 'px';
}
addEventListener('resize', fitCur);
function mark(force) {
  const k = liveIndex(v.currentTime);
  if (!force && k===lastLive && false) return;
  lastLive = k;
  document.querySelectorAll('.row').forEach(r => {
    const i=+r.dataset.i;
    r.classList.toggle('cursor', i===cursor);
    r.classList.toggle('live', i===k);
  });
  const nextIdx = lines.findIndex((l,i)=>i>k && l.t!=null);
  const cur = $('cur'); cur.textContent = '';
  if (k>=0) { const w=document.createElement('span'); w.className='w'; w.textContent=disp(lines[k]);
    const h=document.createElement('span'); h.className='h'; h.textContent=disp(lines[k]); h.style.color=sty.hi; w.appendChild(h); cur.appendChild(w); }
  fitCur();
  $('nxt').textContent = k+1<lines.length ? disp(lines[k+1]) : '';
  const el = document.querySelector('.row.cursor') || document.querySelector('.row.live');
  if (el && (force || !v.paused)) el.scrollIntoView({block:'center', behavior:'smooth'});
}

// ---------- player ----------
$('bPlay').onclick = () => v.paused ? v.play() : v.pause();
v.addEventListener('play',  ()=>$('bPlay').textContent='⏸');
v.addEventListener('pause', ()=>$('bPlay').textContent='▶');
$('vol').oninput = () => v.volume = +$('vol').value;
$('rate').onchange = () => v.playbackRate = +$('rate').value;
v.addEventListener('loadedmetadata', () => v.playbackRate = +$('rate').value);
$('seek').oninput = () => { if (v.duration) v.currentTime = $('seek').value/1000*v.duration; };
let lastK=-2;
// where the colour sweep of line k finishes: the marked end of the singing, else until the next line (max 6 s)
function lineEnd(k) {
  const l = lines[k];
  if (l.e != null && l.e > l.t) return l.e;
  let end = l.t + 6; const nx = lines.slice(k+1).find(x=>x.t!=null); if (nx) end = Math.min(end, nx.t);
  return end;
}
function wipe() {
  const h = document.querySelector('#cur .h'); if (!h) return;
  const t = v.currentTime, k = liveIndex(t), l = lines[k];
  if (!l) return;
  const end = lineEnd(k);
  h.style.width = (100*Math.max(0, Math.min(1, (t-l.t)/Math.max(0.2,end-l.t)))) + '%';
}
// ---------- end of the singing ----------
function computeEnds(all) {
  if (!peaks) return status('Load the audio first: the end times are read from the waveform.');
  snap();
  const n = peaks.mn.length, env = new Float32Array(n), sm = new Float32Array(n), R = 6;   // R = 6 buckets = 30 ms
  for (let i=0;i<n;i++) env[i] = Math.max(peaks.mx[i], -peaks.mn[i]);
  for (let i=0;i<n;i++) { let m=0; for (let j=Math.max(0,i-R); j<=i; j++) if (env[j]>m) m=env[j]; sm[i]=m; }   // looks backwards only, so the next line's attack is not seen early
  const thr = 0.05 / peaks.gain;                       // 5 % of the loudest peak counts as silence
  const idx = lines.map((l,i)=>i).filter(i=>lines[i].t!=null).sort((a,b)=>lines[a].t-lines[b].t);
  let done = 0;
  idx.forEach((i,pos) => {
    const l = lines[i]; if (!all && l.e!=null && l.e>l.t) return;
    const limit = pos+1<idx.length ? lines[idx[pos+1]].t : peaks.dur;
    const lo = Math.floor(l.t*PPS); let k = Math.min(n-1, Math.floor((limit-0.1)*PPS)-1);   // ignore the last 100 ms before the next line
    while (k>lo && sm[k]<thr) k--;                     // walk back from the next line to the last sound
    let e = (k+1)/PPS + 0.08;
    if (e < l.t+0.3) e = Math.min(limit, l.t+1);       // nothing found: assume 1 s
    l.e = Math.min(e, limit); done++;
  });
  save(); render();
  status(done + ' end time' + (done===1?'':'s') + ' set (blue markers on the waveform, drag to fix) — Ctrl+Z to undo');
}
$('bEnds').onclick = e => computeEnds(e.shiftKey);

// ---------- waveform ----------
const wave = $('wave'), wctx = wave.getContext('2d');
const PPS = 200;                       // peak samples per second
let peaks = null, wView = {t0:0, span:60}, wDrag = null;
async function loadWave(f) {
  peaks = null; drawWave();
  if (f.size > 600e6) return status('File too large for the waveform (video still works).');
  try {
    const ac = new (window.AudioContext||window.webkitAudioContext)();
    const buf = await ac.decodeAudioData(await f.arrayBuffer()); ac.close && ac.close();
    const n = Math.ceil(buf.duration*PPS), bs = Math.max(1, Math.floor(buf.sampleRate/PPS));
    const a = buf.getChannelData(0), b = buf.numberOfChannels>1 ? buf.getChannelData(1) : null;
    const mn = new Float32Array(n), mx = new Float32Array(n); let g = 0;
    for (let i=0;i<n;i++) {
      let lo=0, hi=0; const e = Math.min(a.length,(i+1)*bs);
      for (let j=i*bs;j<e;j++) { const x = b ? (a[j]+b[j])/2 : a[j]; if (x<lo) lo=x; if (x>hi) hi=x; }
      mn[i]=lo; mx[i]=hi; g = Math.max(g, -lo, hi);
    }
    peaks = {mn, mx, dur:buf.duration, gain: g>0 ? 1/g : 1};
    wView = {t0:0, span:buf.duration}; drawWave();
  } catch(e) { status('Waveform not available for this file.'); }
}
function drawWave() {
  const dpr = devicePixelRatio||1, W = wave.clientWidth, H = wave.clientHeight;
  if (!W) return;
  if (wave.width !== Math.round(W*dpr)) { wave.width = Math.round(W*dpr); wave.height = Math.round(H*dpr); }
  wctx.setTransform(dpr,0,0,dpr,0,0); wctx.clearRect(0,0,W,H);
  if (!peaks) { wctx.fillStyle='#8b93a0'; wctx.font='13px system-ui'; wctx.fillText('The waveform appears here once a video/audio file is loaded', 12, H/2+4); return; }
  const {t0, span} = wView, mid = H/2, amp = (H/2-12)*peaks.gain, now = v.currentTime;
  for (let x=0;x<W;x++) {
    const ta = t0 + x/W*span, i0 = Math.floor(ta*PPS), i1 = Math.max(i0+1, Math.floor((ta+span/W)*PPS));
    let lo=0, hi=0;
    for (let i=Math.max(0,i0); i<i1 && i<peaks.mn.length; i++) { if (peaks.mn[i]<lo) lo=peaks.mn[i]; if (peaks.mx[i]>hi) hi=peaks.mx[i]; }
    wctx.fillStyle = ta < now ? '#6fa8ff' : '#43628f';
    wctx.fillRect(x, mid-hi*amp, 1, Math.max(1,(hi-lo)*amp));
  }
  // time scale
  const steps=[.1,.2,.5,1,2,5,10,15,30,60,120,300]; const st = steps.find(q=>span/q<=10)||600;
  wctx.fillStyle='#8b93a0'; wctx.font='10px system-ui'; wctx.strokeStyle='#2b3038'; wctx.lineWidth=1;
  for (let t=Math.ceil(t0/st)*st; t<t0+span; t+=st) { const x=(t-t0)/span*W; wctx.beginPath(); wctx.moveTo(x+.5,H-12); wctx.lineTo(x+.5,H); wctx.stroke(); wctx.fillText(fmt(t), x+3, H-2); }
  // line markers
  lines.forEach((l,i) => {
    if (l.t==null || l.t<t0 || l.t>t0+span) return;
    const x = (l.t-t0)/span*W, c = i===cursor;
    wctx.strokeStyle = c ? '#ffdd88' : '#ffb020'; wctx.lineWidth = c ? 2 : 1;
    wctx.beginPath(); wctx.moveTo(x+.5,0); wctx.lineTo(x+.5,H-12); wctx.stroke();
    wctx.fillStyle = '#ffb020'; wctx.font='bold 10px system-ui'; wctx.fillText(String(i+1), x+3, 10);
  });
  lines.forEach((l,i) => {                       // end of the singing (blue)
    if (l.t==null || l.e==null || l.e<=l.t || l.e<t0 || l.e>t0+span) return;
    const x = (l.e-t0)/span*W;
    wctx.strokeStyle = '#5ec8ff'; wctx.lineWidth = 1; wctx.setLineDash([3,3]);
    wctx.beginPath(); wctx.moveTo(x+.5,0); wctx.lineTo(x+.5,H-12); wctx.stroke(); wctx.setLineDash([]);
    wctx.fillStyle = '#5ec8ff'; wctx.font='bold 10px system-ui'; wctx.fillText('⟧'+(i+1), x-18, 22);
  });
  const px = (now-t0)/span*W;
  if (px>=0 && px<=W) { wctx.strokeStyle='#ff4d4d'; wctx.lineWidth=2; wctx.beginPath(); wctx.moveTo(px,0); wctx.lineTo(px,H); wctx.stroke(); }
}
const wT = x => wView.t0 + x/wave.clientWidth*wView.span;
const clampView = () => { if(!peaks) return; wView.span = Math.max(0.5, Math.min(peaks.dur, wView.span)); wView.t0 = Math.max(0, Math.min(peaks.dur-wView.span, wView.t0)); };
function markerAt(x) {                      // nearest start or end marker within 7 px
  let best = null, bd = 7;
  const px = t => (t-wView.t0)/wView.span*wave.clientWidth;
  lines.forEach((l,i) => {
    if (l.t==null) return;
    let d = Math.abs(px(l.t) - x); if (d<bd) { bd=d; best={m:i, end:false}; }
    if (l.e!=null && l.e>l.t) { d = Math.abs(px(l.e) - x); if (d<bd) { bd=d; best={m:i, end:true}; } }
  });
  return best;
}
wave.addEventListener('mousedown', e => {
  if (!peaks) return;
  const hit = markerAt(e.offsetX);
  wDrag = { m: hit ? hit.m : -1, end: hit ? hit.end : false, x0:e.offsetX, t0:wView.t0, moved:false };
});
addEventListener('mousemove', e => {
  if (!wDrag) return;
  const x = e.clientX - wave.getBoundingClientRect().left;
  if (Math.abs(x-wDrag.x0)>3) wDrag.moved = true;
  if (!wDrag.moved) return;
  if (wDrag.m>=0) {
    if (!wDrag.snapped) { snap(); wDrag.snapped = true; }   // one undo step per drag
    const l = lines[wDrag.m], tt = Math.max(0, Math.min(peaks.dur, wT(x)));
    if (wDrag.end) l.e = Math.max(l.t + 0.1, tt); else l.t = tt;
  }
  else { wView.t0 = wDrag.t0 - (x-wDrag.x0)/wave.clientWidth*wView.span; clampView(); }
  drawWave();
});
addEventListener('mouseup', e => {
  if (!wDrag) return;
  const d = wDrag; wDrag = null;
  const x = e.clientX - wave.getBoundingClientRect().left;
  if (d.m>=0) { cursor = d.m; if (d.moved) { save(); } const l = lines[d.m]; v.currentTime = Math.max(0, (d.end ? l.e - 1 : l.t - 0.3)); render(); }
  else if (!d.moved) v.currentTime = Math.max(0, Math.min(peaks.dur, wT(x)));
});
wave.addEventListener('wheel', e => {
  if (!peaks) return; e.preventDefault();
  const tm = wT(e.offsetX), f = e.deltaY<0 ? 0.8 : 1.25;
  wView.span *= f; clampView(); wView.t0 = tm - e.offsetX/wave.clientWidth*wView.span; clampView(); drawWave();
}, {passive:false});
wave.addEventListener('dblclick', () => { if (peaks) { wView = {t0:0, span:peaks.dur}; drawWave(); } });
addEventListener('resize', drawWave);

setInterval(() => {
  if (peaks && !v.paused && !wDrag && wView.span < peaks.dur) {
    const t = v.currentTime;
    if (t > wView.t0 + wView.span*0.9 || t < wView.t0) { wView.t0 = t - wView.span*0.1; clampView(); }
  }
  drawWave();
  wipe();
  $('time').textContent = fmt(v.currentTime) + ' / ' + fmt(v.duration||0);
  if (v.duration) $('seek').value = v.currentTime/v.duration*1000;
  const k = liveIndex(v.currentTime);
  if (k!==lastK) { lastK=k; mark(false); }
}, 50);

// ---------- export ----------
$('bSave').onclick = () => {
  const lrc = lines.filter(l=>l.t!=null).map(l => { const m=Math.floor(l.t/60), s=(l.t-m*60); return `[${String(m).padStart(2,'0')}:${s.toFixed(2).padStart(5,'0')}]${disp(l)}`; }).join('\n');
  saveAs((key.split(':')[1]||'karaoke').replace(/\.[^.]+$/,'') + '.lrc', lrc, 'text/plain', '.lrc', 'Synced lyrics (LRC)');
};
$('bFull').onclick = () => $('stage').requestFullscreen?.();
try { const last = JSON.parse(localStorage.getItem('karaoke:last')||'null');
  if (last && last.lines && last.lines.length) { lines = last.lines; key = last.key; cursor = nextEmpty();
    status('Restored your last project (' + lines.length + ' lines). Load the video again to continue.'); } } catch(e){}
applyStyle();
render();
</script>
</body>
</html>
